[tool.pytest.ini_options]
pythonpath = ["backend", "."]
testpaths = ["backend/tests"]
markers = ["integration: requires explicitly configured MariaDB/Qdrant services"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

